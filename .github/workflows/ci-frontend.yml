name: Frontend CI

on:
  # Reused by deploy.yml (workflow_call) so the same tests gate every deployment.
  workflow_call:
  push:
    # develop and main are tested by deploy.yml; other branches are tested here.
    branches-ignore:
      - develop
      - main
    paths:
      - "packages/frontend/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "packages/frontend/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-frontend.yml"

# Least privilege: tests only read the repository.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend unit tests (Vitest — no external services needed)
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/frontend/node_modules
            packages/shared/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Build shared package
        working-directory: packages/shared
        run: npm run build

      - name: Prepare Nuxt
        working-directory: packages/frontend
        run: npx nuxt prepare

      - name: Run frontend tests
        working-directory: packages/frontend
        run: npm test -- --run
        env:
          NODE_ENV: test
