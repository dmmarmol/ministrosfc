name: Frontend CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (manual deploys are development only)"
        required: true
        default: "development"
        type: choice
        options:
          - development
  release:
    types: [published]
  push:
    branches:
      - "**"
    paths:
      - "packages/frontend/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "packages/frontend/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-frontend.yml"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend unit tests (Vitest — no external services needed)
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/frontend/node_modules
            packages/shared/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Build shared package
        working-directory: packages/shared
        run: npm run build

      - name: Prepare Nuxt
        working-directory: packages/frontend
        run: npx nuxt prepare

      - name: Run frontend tests
        working-directory: packages/frontend
        run: npm test -- --run
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Frontend
  #   release (published) → environment: production → ministrosfc-frontend
  #   push to develop     → environment: development → ministrosfc-frontend-dev
  #   workflow_dispatch   → environment: development → ministrosfc-frontend-dev
  # Production is ONLY reachable via a published GitHub Release.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: [build-frontend]
    if: |
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Frontend to Fly.io
        run: flyctl deploy --config packages/frontend/fly.toml --app ${{ secrets.FRONTEND_APP_NAME }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
