name: Frontend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "packages/frontend/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - "**"
    paths:
      - "packages/frontend/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend unit tests (Vitest — no external services needed)
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/frontend/node_modules
            packages/shared/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build shared package
        working-directory: packages/shared
        run: npm run build

      - name: Run frontend tests
        working-directory: packages/frontend
        run: npm test -- --run
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Frontend — runs only on push to main or develop (not on pull_request)
  # Uses GitHub Environments for scoped secrets:
  #   main    → environment: production → ministrosfc-frontend
  #   develop → environment: development → ministrosfc-frontend-dev
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: [build-frontend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Frontend to Fly.io
        run: flyctl deploy --config packages/frontend/fly.toml --app ${{ secrets.FRONTEND_APP_NAME }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
