name: Seed CMS Admin

# Creates or updates the administrator user. Credentials come from the GitHub environment
# secrets, are injected as environment variables and are never printed.
#   - Automatically (development only) after a successful "Deploy" or "Reset CMS Database" run
#     on develop.
#   - Manually for development or production. Production needs the typed confirmation
#     SEED_ADMIN and the protection rules of the "production" GitHub environment.

on:
  workflow_run:
    workflows: ["Deploy", "Reset CMS Database"]
    types: [completed]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      confirmation:
        description: "Production only: type SEED_ADMIN to confirm"
        required: false
        type: string

permissions:
  contents: read

jobs:
  seed-admin:
    name: Seed admin user in CMS DB
    # Execution model:
    #   This job does NOT compile TypeScript. The compiled seed script
    #   (dist/public/scripts/seed-admin.js) is baked into the Docker image
    #   during the CMS deploy step (packages/cms/Dockerfile runs
    #   `npm run build:public-scripts` in the builder stage).
    #
    #   This job only SSHes into the already-running Fly container and
    #   executes the pre-compiled file. It will work correctly whether
    #   triggered automatically (after the Deploy workflow) or manually via
    #   workflow_dispatch, as long as the app was deployed at least once
    #   with the current Dockerfile.
    #
    #   Credentials (ADMIN_EMAIL, ADMIN_PASSWORD) are injected as env vars
    #   at runtime — they are never written to disk or logged.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'develop'
      )
    runs-on: ubuntu-latest
    # workflow_dispatch -> selected environment; workflow_run -> development
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}

    steps:
      - name: Require confirmation for production
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "SEED_ADMIN" ]]; then
            echo "Seeding production requires the typed confirmation SEED_ADMIN." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Upsert admin user on Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CMS_APP_NAME: ${{ secrets.CMS_APP_NAME }}
          CMS_ADMIN_EMAIL: ${{ secrets.CMS_ADMIN_EMAIL }}
          CMS_ADMIN_PASSWORD: ${{ secrets.CMS_ADMIN_PASSWORD }}
        run: ./scripts/seed-admin/seed-cms-admin.sh
