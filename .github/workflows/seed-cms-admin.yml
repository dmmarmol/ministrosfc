name: Seed CMS Admin

on:
  workflow_run:
    workflows: ["CMS CI/CD"]
    types: [completed]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - production

jobs:
  seed-admin:
    name: Seed admin user in CMS DB
    # Execution model:
    #   This job does NOT compile TypeScript. The compiled seed script
    #   (dist/public/scripts/seed-admin.js) is baked into the Docker image
    #   during the CMS deploy step (packages/cms/Dockerfile runs
    #   `npm run build:public-scripts` in the builder stage).
    #
    #   This job only SSHes into the already-running Fly container and
    #   executes the pre-compiled file. It will work correctly whether
    #   triggered automatically (after CMS CI/CD) or manually via
    #   workflow_dispatch, as long as the app was deployed at least once
    #   with the current Dockerfile.
    #
    #   Credentials (ADMIN_EMAIL, ADMIN_PASSWORD) are injected as env vars
    #   at runtime — they are never written to disk or logged.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'develop'
      )
    runs-on: ubuntu-latest
    # workflow_dispatch -> selected environment; workflow_run -> development
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Upsert admin user on Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CMS_APP_NAME: ${{ secrets.CMS_APP_NAME }}
          CMS_ADMIN_EMAIL: ${{ secrets.CMS_ADMIN_EMAIL }}
          CMS_ADMIN_PASSWORD: ${{ secrets.CMS_ADMIN_PASSWORD }}
        run: ./scripts/seed-admin/seed-cms-admin.sh
