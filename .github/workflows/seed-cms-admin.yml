name: Seed CMS Admin

on:
  workflow_run:
    workflows: ["CMS CI/CD"]
    types: [completed]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - production

jobs:
  seed-admin:
    name: Seed admin user in CMS DB
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'develop'
      )
    runs-on: ubuntu-latest
    # workflow_dispatch -> selected environment; workflow_run -> development
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Upsert admin user on Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CMS_APP_NAME: ${{ secrets.CMS_APP_NAME }}
          CMS_ADMIN_EMAIL: ${{ secrets.CMS_ADMIN_EMAIL }}
          CMS_ADMIN_PASSWORD: ${{ secrets.CMS_ADMIN_PASSWORD }}
        run: ./scripts/seed-admin/seed-cms-admin.sh
