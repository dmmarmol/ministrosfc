# Ministros FC - Frontend (DEV)
# One Fly config per environment. No secrets are needed by the frontend; everything below is public.
app = "ministrosfc-frontend-dev"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Static response: does not call the API or the database.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/robots.txt"

[env]
  APP_ENV = "development"
  APP_PORT = "3000"
  PORT = "3000"
  NITRO_PORT = "3000"
  HOST = "0.0.0.0"
  NITRO_HOST = "0.0.0.0"
  NODE_ENV = "production"
  NUXT_PUBLIC_API_BASE_URL = "https://ministrosfc-cms-dev.fly.dev"
  NUXT_PUBLIC_APP_URL = "https://ministrosfc-frontend-dev.fly.dev"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
